name: Build Anoy Loader APK

on:
  push:
    branches: ['arena/**']
    paths-ignore: ['admin-panel/**', 'supabase/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anoy-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Anoy Loader release (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and exact NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cmdtools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$RUNNER_TEMP/android-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;24.0.8215888'
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Anoy only
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p ci-logs
          ./gradlew :app:assembleAnoyRelease --no-daemon --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME" 2>&1 | tee ci-logs/gradle-build.log
      - name: Verify and package signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="app/build/outputs/apk/anoy/release/app-anoy-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$APK"
          cp "$APK" "dist/AnoyLoader-1.4.2-${GITHUB_SHA:0:7}-arm64.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          echo '## Anoy Loader release APK' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only Anoy Loader (com.ryzen), arm64-v8a, was built. Download the APK artifact below.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Anoy APK
        uses: actions/upload-artifact@v4
        with:
          name: AnoyLoader-release-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnoyLoader-build-logs-${{ github.run_number }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7
