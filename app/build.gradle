plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.lsposed.lsparanoid'
}



class Scrambler {
    Random random = new Random()

    String getRandomString(int i) {
        return random.with {(1..(6 + random.nextInt(i))).collect {(('a'..'z')).join()[ nextInt((('a'..'z')).join().length())]}.join()}
    }
}

Scrambler scrambler = new Scrambler()

android {
    namespace 'com.ryzen'
    compileSdk 34
    
    signingConfigs {
        debug {
            storeFile file("zen.jks")
            storePassword "11111111"
            keyPassword "11111111"
            keyAlias "key0"
        }
        release {
            storeFile file("zen.jks")
            storePassword "11111111"
            keyPassword "11111111"
            keyAlias "key0"
        }
    }
    
    lint {
        baseline = file("lint-baseline.xml")
    }

    defaultConfig {
        applicationId "com.ryzen"
        minSdk 24
        targetSdk 33
        versionCode 3
        versionName "1.2.0"

        resConfigs "en"

        vectorDrawables {
            useSupportLibrary true
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Only ndkBuild is used (src/main/jni/Android.mk). Do NOT declare cmake here —
        // an empty cmake block confuses AGP and fails CI with "CMake ... not found".
        externalNativeBuild {
            ndkBuild {
                abiFilters "arm64-v8a"
                arguments "NDK_APPLICATION_MK:=src/main/jni/Application.mk"
            }
        }
        ndk {
            abiFilters "arm64-v8a"
        }

        multiDexEnabled false
    }

    flavorDimensions "brand"
    productFlavors {
        anoy {
            dimension "brand"
            applicationId "com.ryzen"
            // Display name / telegram come from main/res (Anoy Loader)
        }
        ogcheats {
            dimension "brand"
            applicationId "com.ogcheats"
            // Branding + icon overrides live under OgCheats/src/main/res
        }
    }

    sourceSets {
        ogcheats {
            res.srcDirs = ['../OgCheats/src/main/res']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/*.version',
                '/*.proto'
            ]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            ndk {
                debugSymbolLevel 'NONE'
            }
        }
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    lsparanoid {
        seed = 1919810
        global = false
        includeDependencies = false
        variantFilter = { true }
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }

    }
    ndkVersion "24.0.8215888"
}

dependencies {
    implementation project(':Bcore')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.9.0'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.4'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.4'

    // Jetpack Compose & Material 3
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

