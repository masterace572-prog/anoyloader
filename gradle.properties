#AndroidIDE: enforce UTF-8 & locale for Gradle daemon
#Wed Apr 01 14:27:16 GMT 2026
android.nonTransitiveRClass=true
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
# More heap for NDK + minify release builds (local + GitHub Actions)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding\=UTF-8
android.useAndroidX=true
org.gradle.parallel=true
org.gradle.caching=true
# Windows local only — DO NOT set on Linux CI (GitHub Actions uses JAVA_HOME).
# Uncomment on your Windows machine if Gradle cannot find JDK 17:
# org.gradle.java.home=C:/Program Files/Java/jdk-17
